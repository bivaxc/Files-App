name: Build and Deploy Files PWA

on:
  push:
    branches:
      - main
    paths:
      - "Files-PWA-MVP.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q Files-PWA-MVP.zip -d extracted
          PACKAGE_JSON=$(find extracted -name package.json -not -path '*/node_modules/*' -print -quit)
          if [ -z "$PACKAGE_JSON" ]; then
            echo "No package.json found inside the ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build application
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4