name: Build and Deploy Files PWA

on:
  push:
    branches:
      - main
    paths:
      - "Files-PWA-MVP.zip"
      - "index.html"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use repository source files
        run: |
          test -f package.json
          test -f vite.config.js
          test -d src
          test -d public || mkdir -p public
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build application
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4